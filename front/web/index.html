<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="front">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Campus Marketplace</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script>
    function openRazorpayCheckout(keyId, amountInPaise, orderId, name, description, userEmail, userContact) {
      var options = {
        "key": keyId,
        "amount": amountInPaise,
        "currency": "INR",
        "name": name || "Campus Marketplace",
        "description": description || "Product Purchase",
        "order_id": orderId,
        "handler": function (response) {
          if (window.onRazorpaySuccess) {
            window.onRazorpaySuccess(response.razorpay_payment_id, response.razorpay_order_id, response.razorpay_signature);
          }
        },
        "prefill": {
          "name": "Hitija Mhatre",
          "email": userEmail || "hitija@campus.edu",
          "contact": userContact || "9876543210"
        },
        "notes": {
          "address": "Campus Department"
        },
        "theme": {
          "color": "#2563EB"
        },
        "modal": {
          "ondismiss": function() {
            if (window.onRazorpayDismiss) {
              window.onRazorpayDismiss();
            }
          }
        }
      };
      var rzp1 = new Razorpay(options);
      rzp1.open();
    }
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
